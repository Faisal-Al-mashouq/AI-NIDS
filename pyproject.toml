[project]
name = "ai-nids"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black[jupyter]>=25.0.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "ruff>=0.15.1",
    "scikit-learn>=1.8.0",
    "taskipy>=1.14.1",
    "tqdm>=4.68.3",
    "typer>=0.25.1",
    "xgboost>=3.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.black]
target-version = ["py312"]

[tool.taskipy.tasks]
format    = "uv run black . && uv run ruff check --fix ."
lint      = "uv run black --check . && uv run ruff check ."
precommit = "uv run pre-commit run --all-files"
test      = "uv run pytest"
dataset   = "uv run -m bin.download_dataset"
process   = "uv run -m bin.process_data"
train     = "uv run -m bin.train"
evaluate  = "uv run -m bin.evaluate"
plot      = "uv run -m bin.plot_importance"
detect    = "uv run -m bin.detect"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
